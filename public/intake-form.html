<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>初談問卷</title>
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#0e7c7b">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body { background: #eef3f4; }
    .fam-wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 30px; }
    .fam-head {
      background: linear-gradient(140deg, var(--primary), #123a3a); color: #fff;
      padding: 18px 18px 16px; border-radius: 0 0 18px 18px;

    .fam-head h1 { font-size: 18px; }
    .fam-head .sub { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 3px; }
    .fam-body { padding: 14px; }
    .crisis {
      background: var(--danger-bg); color: var(--danger); border-radius: 10px;
      padding: 10px 12px; font-size: 13px; line-height: 1.7; margin-bottom: 12px;
    }
  </style>
